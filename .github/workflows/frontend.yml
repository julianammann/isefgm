name: frontend
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "mise.toml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "mise.toml"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: node pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Generated API types are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- src/lib/api/schema.d.ts

      - run: pnpm run lint
      - run: pnpm run check

      - name: Browser for component tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test

      - run: pnpm run build
      - run: pnpm audit --audit-level=high
