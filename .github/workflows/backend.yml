name: backend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "mise.toml"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "mise.toml"
      - "compose.yaml"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Part of the cache key, so a cached binary always matches. Dependabot does
          # not bump this input; raise it by hand (#92).
          version: 2026.10.3
          install_args: python uv
      - run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Migrations apply cleanly and are complete
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # QZ-07: at least 70 % line coverage. pytest-cov measures it via addopts in
      # pyproject.toml; the threshold lives here so a local run of a single test
      # file does not fail on total coverage.
      - name: Tests
        run: uv run pytest -q --cov-fail-under=70 --cov-report=html

      # Also on failure: a missed threshold is when the report is needed most.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/htmlcov/

      # Closes the gap where frontend CI only checks types against the committed
      # openapi.json: here we check that openapi.json itself matches the backend.
      - name: OpenAPI schema in frontend is up to date
        run: |
          uv run python -m giftmanager.export_openapi > ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

      # Audit the locked production dependencies. Plain `uvx pip-audit` would audit
      # its own isolated tool environment instead of this project.
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
