min_version: 2.0.0

pre-commit:
  parallel: true
  commands:
    ruff-lint:
      root: backend/
      glob: "*.py"
      run:  uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      root: backend/
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks protect --staged --redact

pre-push:
  parallel: true
  commands:
    pyright:
      root: backend/
      run: uv run pyright
    alembic-check:
      root: backend/
      #needs a running DB
      run: uv run alembic check