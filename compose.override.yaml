# Local development only. Compose merges this automatically on `docker compose up`;
# the deploy uses compose.yaml + compose.production.yaml and never sees this file.
x-dev-backend-env: &dev-backend-env
  APP_ENV: development
  LOG_LEVEL: DEBUG

x-backend-build: &backend-build
  context: ./backend
  args:
    UV_VERSION: ${UV_VERSION:-0.12.9}

services:
  db:
    ports:
      - "5432:5432"

  migrate:
    build: *backend-build

  api:
    build: *backend-build
    environment: *dev-backend-env
    ports:
      - "8000:8000"

  scheduler:
    build: *backend-build
    environment:
      <<: *dev-backend-env
      SMTP_HOST: isefgm-mailpit

  # Local test inbox: SMTP on 1025, web UI on http://localhost:8025.
  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      app-net:
        aliases: [isefgm-mailpit]

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
