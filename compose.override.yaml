# Local development only. Compose merges this automatically on `docker compose up`;
# the deploy uses compose.yaml + compose.production.yaml and never sees this file.
x-dev-backend-env: &dev-backend-env
  APP_ENV: development
  LOG_LEVEL: DEBUG

x-backend-build: &backend-build
  context: ./backend
  args:
    UV_VERSION: ${UV_VERSION:-0.12.9}

services:
  db:
    ports:
      - "5432:5432"

  migrate:
    build: *backend-build

  api:
    build: *backend-build
    environment: *dev-backend-env
    ports:
      - "8000:8000"

  scheduler:
    build: *backend-build
    environment:
      <<: *dev-backend-env
      SMTP_HOST: isefgm-mailpit

  # Local test inbox: SMTP on 1025, web UI on http://localhost:8025.
  mailpit:
    image: docker.io/axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      app-net:
        aliases: [isefgm-mailpit]

  frontend:
    build:
      context: ./frontend
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
