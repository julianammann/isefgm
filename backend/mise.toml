[tasks.install]
run = "uv sync"

[tasks.dev]
# APP_ENV defaults to production (Secure cookie, no /docs); the dev server opts out.
env = { APP_ENV = "development" }
run = "uv run fastapi dev src/giftmanager/main.py"

[tasks.lint]
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.fix]
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.typecheck]
run = "uv run pyright"

[tasks.test]
description = "needs docker testcontainers"
run = "uv run pytest"

[tasks.check]
depends = ["lint", "typecheck", "test"]

[tasks.migrate]
run = "uv run alembic upgrade head"

[tasks.migration]
description = "mise run migration -- 'add users'"
run = "uv run alembic revision --autogenerate -m"

[tasks."migrate:check"]
run = "uv run alembic check"

[tasks.create-user]
description = "mise run create-user -- --email anna@example.org --display-name Anna"
run = "uv run python -m giftmanager.create_user"

[tasks.openapi]
run = "uv run python -m giftmanager.export_openapi > ../frontend/openapi.json"

[tasks.docs]
description = "render docs/generated/{api,database,configuration}.md from code"
run = "uv run python -m giftmanager.export_docs ../docs/generated"

[tasks.apidocs]
description = "code reference from docstrings as Markdown into ../docs/site/backend (Sphinx, docs/conf.py)"
run = "uv run python docs/build.py ../docs/site/backend"
