[tasks.install]
run = "uv sync"

[tasks.dev]
run = "uv run fastapi dev src/giftmanager/main.py"

[tasks.lint]
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.fix]
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.typecheck]
run = "uv run pyright"

[tasks.test]
description = "needs docker testcontainers"
run = "uv run pytest"

[tasks.check]
depends = ["lint", "typecheck", "test"]

[tasks.migrate]
run = "uv run alembic upgrade head"

[tasks.migration]
description = "mise run migration -- 'add users'"
run = "uv run alembic revision --autogenerate -m"

[tasks."migrate:check"]
run = "uv run alembic check"

[tasks.openapi]
run = "uv run python -m giftmanager.export_openapi > ../frontend/openapi.json"
