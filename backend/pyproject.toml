[project]
name = "giftmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "julianammann", email = "julian@mmann.io" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
]

[project.scripts]
giftmanager = "giftmanager:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",        # PyCodeStyle warnings
    "UP",        # PyCodeStyle errors
    "B",        # Sort imports properly
    "ASYNC",
    "S",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "SIM",      # Common simplification rules
    "RET",      # Good return practices
    "TID",      # Some good import practices
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "FURB",     # Suggest more idiomatic Python patterns
    "RUF"
]
ignore = [
    "E501",
    "ISC001",
    "TD002", "TD003"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","S105", "S106"]
"alembic/**" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["giftmanager"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests", "alembic"]
exclude = ["alembic/versions"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error", "ignore::DeprecationWarning"]


