[project]
name = "giftmanager"
version = "0.1.0"
description = "Geschenke-Manager backend: FastAPI, SQLAlchemy 2.0 async, Alembic"
readme = "README.md"
authors = [
    { name = "julianammann", email = "julian@mmann.io" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "anyio>=4.15.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0",
    "ruff>=0.16.8",
    "sphinx>=9.1.0",
    "sphinx-markdown-builder>=0.6.11",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",        # isort
    "UP",       # pyupgrade: modern syntax for the targeted Python version
    "B",        # flake8-bugbear: likely bugs
    "ASYNC",    # flake8-async: blocking calls in async code
    "S",        # flake8-bandit: security
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "TID",      # flake8-tidy-imports (bans relative imports below)
    "PTH",      # flake8-use-pathlib
    "TD",       # flake8-todos
    "FURB",     # refurb: idiomatic Python
    "RUF",      # Ruff-specific rules
    "D1",       # pydocstyle: public modules, classes and functions need a docstring (code reference)
]
ignore = [
    "D105", "D107",  # magic methods, __init__: arguments go in the class docstring (Google style)
    "E501",
    "ISC001",
    "TD002", "TD003"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","S105", "S106", "D1"]
"alembic/**" = ["E402", "F401", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["giftmanager"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests", "alembic"]
exclude = ["alembic/versions"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=giftmanager --cov-report=term-missing --strict-markers"
markers = [
    "requirement(*ids): requirement IDs from MS 1 (F-xx, Q-xx); conftest.py builds docs/generated/traceability.md from them",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]
