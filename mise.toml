[tools]
gitleaks = "8.30.1"
lefthook = "2.1.14"
node = "26.9.0"
pnpm = "12.5.1"
python = "3.14"
uv = "0.12.9"

[env]
_.file = ".env"

[tasks.setup]
description = "setup complete project"
run = """
mise -C backend run install
mise -C frontend run install
pnpm --dir docs/site install --frozen-lockfile
lefthook install
"""

[tasks.db]
run = "docker compose up -d db"

[tasks.check]
description = "full project lint, typecheck"
run = ["mise -C backend run check", "mise -C frontend run check"]

[tasks.openapi]
description = "export schema and generate types"
run = ["mise -C backend run openapi", "mise -C frontend run generate"]

[tasks.docker]
description = "build image with pinned uv version"
env = { UV_VERSION = "{{ exec(command='mise current uv') }}" }
run = "docker compose build"

[tasks.docs]
description = "regenerate code-derived documentation (docs/generated/)"
run = ["mise -C backend run docs", "mise -C backend run test"]

[tasks.apidocs]
description = "code reference site: Sphinx (backend) + TypeDoc (frontend) as Markdown, built with VitePress into apidocs/"
run = [
  "mise -C backend run apidocs",
  "mise -C frontend run apidocs",
  "pnpm --dir docs/site run build",
]

[tasks."apidocs:serve"]
description = "build the code reference and serve it on http://localhost:4173"
depends = ["apidocs"]
run = "pnpm --dir docs/site run preview"
